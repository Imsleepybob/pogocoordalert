<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>좌표 확인</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    max-width: 480px;
    margin: 40px auto;
    padding: 16px;
    background: #f5f5f5;
    color: #222;
    text-align: center;
  }
  .card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 24px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-top: 10px;
    margin-bottom: 4px;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }
  button {
    margin-top: 12px;
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    background: #333;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  #coords-result {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
  }
  #copy-btn {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 20px;
  }
  #maps-link {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 20px;
    background: #007aff;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
  }
  #error-msg {
    color: #c0392b;
    margin-top: 12px;
    font-size: 14px;
  }
  .hidden {
    display: none;
  }
</style>
</head>
<body>

<div class="card">
  <h2>좌표 확인</h2>
  <div id="token-section">
    <label>GitHub Pages에서 쓰던 토큰이 아니라, PoGO Coordinates 로그인 토큰(JWT)이 필요합니다.</label>
    <input type="password" id="jwt-input" placeholder="JWT 토큰">
    <button id="jwt-save-btn">토큰 저장 및 조회</button>
  </div>
  <div id="coords-result"></div>
  <button id="copy-btn" class="hidden">좌표 복사</button>
  <br>
  <a id="maps-link" class="hidden" href="#" target="_blank">지도에서 열기</a>
  <div id="error-msg"></div>
</div>

<script>
const PROXY_BASE = "https://pogo-reveal-proxy.creatervictory9.workers.dev";

function getRevealCode() {
  const params = new URLSearchParams(window.location.search);
  return params.get("code");
}

function getJwt() {
  return localStorage.getItem("pgp_jwt_token");
}

async function fetchCoords(revealCode, jwt) {
  const response = await fetch(`${PROXY_BASE}?code=${revealCode}`, {
    headers: {
      Authorization: `Bearer ${jwt}`,
    },
  });
  if (!response.ok) {
    const error = new Error(`요청 실패 (상태 코드: ${response.status})`);
    error.status = response.status;
    throw error;
  }
  return response.json();
}

function isIos() {
  return /iPhone|iPad|iPod/.test(navigator.userAgent);
}

function getMapsUrl(lat, lng) {
  if (isIos()) {
    return `https://maps.apple.com/?ll=${lat},${lng}&q=Pokemon`;
  }
  return `https://www.google.com/maps?q=${lat},${lng}`;
}

async function showCoords() {
  const revealCode = getRevealCode();
  const jwt = getJwt();
  const errorEl = document.getElementById("error-msg");
  const resultEl = document.getElementById("coords-result");
  const mapsLinkEl = document.getElementById("maps-link");
  const copyBtnEl = document.getElementById("copy-btn");

  if (!revealCode) {
    errorEl.textContent = "좌표 코드가 URL에 없습니다.";
    return;
  }
  if (!jwt) {
    return;
  }

  try {
    const data = await fetchCoords(revealCode, jwt);
    resultEl.textContent = data.coords;
    mapsLinkEl.href = getMapsUrl(data.lat, data.lng);
    mapsLinkEl.textContent = isIos() ? "Apple Maps에서 열기" : "Google Maps에서 열기";
    mapsLinkEl.classList.remove("hidden");
    copyBtnEl.classList.remove("hidden");
    copyBtnEl.onclick = () => {
      navigator.clipboard.writeText(data.coords).then(() => {
        copyBtnEl.textContent = "복사됨";
        setTimeout(() => { copyBtnEl.textContent = "좌표 복사"; }, 1500);
      });
    };
    document.getElementById("token-section").style.display = "none";
    errorEl.textContent = "";
  } catch (e) {
    if (e.status === 410) {
      errorEl.textContent = "이미 디스폰되어 좌표를 확인할 수 없습니다.";
    } else if (e.status === 429) {
      errorEl.textContent = "요청이 몰려 잠시 제한되었습니다. 잠시 후 다시 시도해주세요.";
    } else if (e.status === 401) {
      errorEl.textContent = "토큰이 유효하지 않습니다. 토큰을 다시 확인해주세요.";
      localStorage.removeItem("pgp_jwt_token");
      document.getElementById("token-section").style.display = "block";
    } else {
      errorEl.textContent = e.message;
    }
  }
}

document.getElementById("jwt-save-btn").addEventListener("click", () => {
  const value = document.getElementById("jwt-input").value.trim();
  if (!value) {
    return;
  }
  localStorage.setItem("pgp_jwt_token", value);
  showCoords();
});

showCoords();
</script>

</body>
</html>
