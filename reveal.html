<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>좌표 확인</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    max-width: 480px;
    margin: 40px auto;
    padding: 16px;
    background: #f5f5f5;
    color: #222;
    text-align: center;
  }
  .card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 24px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-top: 10px;
    margin-bottom: 4px;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }
  button {
    margin-top: 12px;
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    background: #333;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  #coords-result {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
  }
  #maps-link {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 20px;
    background: #007aff;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
  }
  #error-msg {
    color: #c0392b;
    margin-top: 12px;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="card">
  <h2>좌표 확인</h2>
  <div id="token-section">
    <label>GitHub Pages에서 쓰던 토큰이 아니라, PoGO Coordinates 로그인 토큰(JWT)이 필요합니다.</label>
    <input type="password" id="jwt-input" placeholder="JWT 토큰">
    <button id="jwt-save-btn">토큰 저장 및 조회</button>
  </div>
  <div id="coords-result"></div>
  <a id="maps-link" class="hidden" href="#" target="_blank">Apple Maps에서 열기</a>
  <div id="error-msg"></div>
</div>

<script>
const API_BASE = "https://coordinates-api.pokemongopro.com";

function getRevealCode() {
  const params = new URLSearchParams(window.location.search);
  return params.get("code");
}

function getJwt() {
  return localStorage.getItem("pgp_jwt_token");
}

async function fetchCoords(revealCode, jwt) {
  const response = await fetch(`${API_BASE}/reveal/${revealCode}`, {
    headers: {
      Authorization: `Bearer ${jwt}`,
    },
  });
  if (!response.ok) {
    throw new Error(`요청 실패 (상태 코드: ${response.status})`);
  }
  return response.json();
}

async function showCoords() {
  const revealCode = getRevealCode();
  const jwt = getJwt();
  const errorEl = document.getElementById("error-msg");
  const resultEl = document.getElementById("coords-result");
  const mapsLinkEl = document.getElementById("maps-link");

  if (!revealCode) {
    errorEl.textContent = "좌표 코드가 URL에 없습니다.";
    return;
  }
  if (!jwt) {
    return;
  }

  try {
    const data = await fetchCoords(revealCode, jwt);
    resultEl.textContent = data.coords;
    mapsLinkEl.href = `https://maps.apple.com/?ll=${data.lat},${data.lng}&q=Pokemon`;
    mapsLinkEl.classList.remove("hidden");
    document.getElementById("token-section").style.display = "none";
    errorEl.textContent = "";
  } catch (e) {
    errorEl.textContent = e.message;
  }
}

document.getElementById("jwt-save-btn").addEventListener("click", () => {
  const value = document.getElementById("jwt-input").value.trim();
  if (!value) {
    return;
  }
  localStorage.setItem("pgp_jwt_token", value);
  showCoords();
});

showCoords();
</script>

</body>
</html>
